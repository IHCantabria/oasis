site_name: OASIS Documentation
site_description: Offshore Advanced SImulation Software — User, Developer & API Documentation
site_url: https://ihcantabria.github.io/oasis/
repo_url: https://github.com/ihcantabria/oasis
repo_name: ihcantabria/oasis

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Installation:
    - Windows: installation/windows.md
    - Linux / HPC: installation/linux.md
  - User Manual:
    - Overview: user-manual/index.md
    - Graphical Interface (GUI): user-manual/gui.md
    - Running Simulations: user-manual/running-simulations.md
    - Input Format: user-manual/input-format.md
    - Input Reference: user-manual/input-reference.md
    - Output Files: user-manual/output-files.md
    - Examples: user-manual/examples.md
    - Features:
      - Waves: user-manual/waves.md
      - Mooring Lines: user-manual/mooring-lines.md
      - Springs & Connectors: user-manual/springs.md
      - Winches: user-manual/winches.md
      - Oscillating Water Columns: user-manual/owc.md
      - Wind Turbines: user-manual/wind-turbines.md
      - ODE Solvers: user-manual/solvers.md
  - Developer Manual:
    - Code Structure: developer-manual/code-structure.md
    - Building: developer-manual/building.md
    - Contributing: developer-manual/contributing.md
  - Theory Manual: theory-manual.md
  - API Reference: api-reference.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.mark
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
